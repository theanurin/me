name: CI/CD Website Pipeline

env:
  # Коли переїдете на власний домен, просто змініть це на: SITE_PREFIX: "/"
  SITE_PREFIX: "/${{ github.event.repository.name }}/"

on:
  push:
    branches:
      - "eleventy-migration"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 1.1 Білд для історії (тільки теги)
  build-history:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch dependencies
        run: |
          npm install --include dev
      - name: Build History Version
        run: |
          BUILD_CONFIGURATION=release npx eleventy --pathprefix='${{ env.SITE_PREFIX }}history/${{ github.ref_name }}' --output='dist-history/${{ github.ref_name }}/'
      - uses: actions/upload-artifact@v7
        with:
          name: history-artifact
          path: dist-history/

  # 1.2 Білд для кореня (тільки теги)
  build-root:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch dependencies
        run: |
          npm install --include dev
      - name: Build Root Version
        run: |
          BUILD_CONFIGURATION=release npx eleventy --pathprefix='${{ env.SITE_PREFIX }}' --output='dist-root/'
      - uses: actions/upload-artifact@v7
        with:
          name: root-artifact
          path: dist-root/

  # 1.3 Білд для preview (тільки main branch)
  build-preview:
    if: github.ref == 'refs/heads/eleventy-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch dependencies
        run: |
          npm install --include dev
      - name: Build Preview
        run: |
          BUILD_CONFIGURATION=snapshot npx eleventy --pathprefix='${{ env.SITE_PREFIX }}preview' --output='dist-preview/'
      - uses: actions/upload-artifact@v7
        with:
          name: preview-artifact
          path: dist-preview/

  # 2. Деплой джоба
  deploy:
    needs: [build-history, build-root, build-preview]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Checkout Pages Branch
        uses: actions/checkout@v6
        with:
          ref: 'gh-pages'
          path: 'deployment-dir'

# 1. Завантажуємо корінь (тільки якщо був тег)
      - name: Download Root Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v7
        with:
          name: root-artifact
          path: incoming-artifacts/root-artifact

      # 2. Завантажуємо історію (тільки якщо був тег)
      - name: Download History Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v7
        with:
          name: history-artifact
          path: incoming-artifacts/history-artifact

      # 3. Завантажуємо прев'ю (тільки якщо це бранч)
      - name: Download Preview Artifact
        if: github.ref == 'refs/heads/eleventy-migration'
        uses: actions/download-artifact@v7
        with:
          name: preview-artifact
          path: incoming-artifacts/preview-artifact

      - name: Debug(List) incoming artifacts
        run: |
          cd deployment-dir
          ls -l ../
          ls -l ../incoming-artifacts

      - name: Prepare and Merge Content
        run: |
          # Налаштовуємо Git всередині папки деплою
          cd deployment-dir

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Обробка кореня (якщо прийшов тег)
          if [ -d "../incoming-artifacts/root-artifact" ]; then
            # Видаляємо все в корені, ОКРІМ папок history, preview та системної .git
            # Це гарантує, що видалені файли в Eleventy зникнуть і з сервера
            find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name 'history' ! -name 'preview' ! -name '.nojekyll' -exec rm -rf {} +

            # Копіюємо новий чистий білд
            cp -r ../incoming-artifacts/root-artifact/* .
          fi

          # 2. Обробка історії (якщо прийшов тег)
          if [ -d "../incoming-artifacts/history-artifact/${{ github.ref_name }}" ]; then
            mkdir -p history
            rm -rf history/${{ github.ref_name }}
            cp -r ../incoming-artifacts/history-artifact/${{ github.ref_name }} history/
          fi

          # 3. Обробка preview (якщо прийшов коміт у main)
          if [ -d "../incoming-artifacts/preview-artifact" ]; then
            rm -rf preview
            mkdir -p preview
            cp -r ../incoming-artifacts/preview-artifact/* preview/
          fi

      - name: Generate robots.txt
        run: |
          cd deployment-dir
          cat <<EOF | tee robots.txt
          User-agent: *
          Disallow: ${{ env.SITE_PREFIX }}preview/
          EOF

      - name: Push changed
        run: |
          cd deployment-dir

          touch .nojekyll

          # Комітимо та пушимо, якщо є зміни
          git add --all
          git status
          git commit -m "Deploy update from ${{ github.ref_name }} / ${{ github.sha }}"
          git log -1
          git push origin gh-pages
