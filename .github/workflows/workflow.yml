name: CI/CD Website Pipeline

on:
  push:
    branches:
      - "main"
      - "eleventy-migration"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 1.1 Білд для історії (тільки теги)
  build-history:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch dependencies
        run: |
          npm install --include dev
      - name: Build History Version
        run: |
          export BUILD_PREFIX=/history/${{ github.ref_name }}
          npx eleventy --pathprefix='${BUILD_PREFIX}' --output='dist-history/${BUILD_PREFIX}/'
      - uses: actions/upload-artifact@v4
        with:
          name: history-artifact
          path: dist-history/

  # 1.2 Білд для кореня (тільки теги)
  build-root:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch dependencies
        run: |
          npm install --include dev
      - name: Build Root Version
        run: |
          npx eleventy --pathprefix='/' --output='dist-history/'
      - uses: actions/upload-artifact@v4
        with:
          name: root-artifact
          path: dist-root/

  # 1.3 Білд для preview (тільки main branch)
  build-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Preview
        run: |
          npx eleventy --pathprefix='/preview' --output='dist-preview/'
      - uses: actions/upload-artifact@v4
        with:
          name: preview-artifact
          path: dist-preview/

  # 2. Деплой джоба
  deploy:
    needs: [build-history, build-root, build-preview]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Checkout Pages Branch
        uses: actions/checkout@v4
        with:
          ref: 'gh-pages'
          path: 'deployment-dir'

      # Завантажуємо всі доступні артефакти (якщо їх немає - крок просто пропуститься)
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming-artifacts

      - name: Prepare and Merge Content
        run: |
          # Налаштовуємо Git всередині папки деплою
          cd deployment-dir

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Обробка кореня (якщо прийшов тег)
          if [ -d "../incoming-artifacts/root-artifact" ]; then
            cp -r ../incoming-artifacts/root-artifact/* .
          fi

          # 2. Обробка історії (якщо прийшов тег)
          if [ -d "../incoming-artifacts/history-artifact/${{ github.ref_name }}" ]; then
            mkdir -p history
            rm -rf history/${{ github.ref_name }}
            cp -r ../incoming-artifacts/history-artifact/${{ github.ref_name }} history/
          fi

          # 3. Обробка preview (якщо прийшов коміт у main)
          if [ -d "../incoming-artifacts/preview-artifact" ]; then
            rm -rf preview
            mkdir -p preview
            cp -r ../incoming-artifacts/preview-artifact/* preview/
          fi

          # Комітимо та пушимо, якщо є зміни
          git add --all
          git status
          git diff-index --quiet HEAD || git commit -m "Deploy update from ${{ github.ref_name }} / ${{ github.sha }}"
          git log
          #git push origin gh-pages
