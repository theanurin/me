title: Maksym Anurin
baseurl: "/devel" # the subpath of your site, e.g. /blog
url: "https://anurin.name" # the base hostname & protocol for your site, e.g. http://example.com

author:
  name: Maksym Anurin
  email: me@anurin.name

# See https://michaelcurrin.github.io/dev-cheatsheets/cheatsheets/jekyll/configuration/strict-rendering.html
liquid:
  error_mode:       warn
  strict_variables: false
  strict_filters:   false

# minima:
#   date_format:

# disqus:
#   shortname:

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
## Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .jekyll-cache/
  - .submodules/
  - .vscode/
  - docker/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - TODO.md

# Use theme
theme: jekyll-theme-anurina

#
# Configuration for jekyll-theme-anurina
#
anurina:
  bootstrap:
    source: local
    #
    # Select container of body root element. See https://getbootstrap.com/docs/5.2/layout/containers/
    #
    # Use one of: sm, md, lg, xl, xxl or fluid
    #
    body_container_suffix: xxl

  locale:
    #
    # Set default locale for the site
    #
    default: uk-UA

    #
    # Define locales (with priority)
    #
    sequence:
      - en-US
      - uk-UA

  menuable:
    - index.markdown
    # - sdlc.markdown
    - about.markdown

  #
  # Select color scheme:
  #
  #   light - Default, light color scheme.
  #   dark - Dark variant of the light color scheme.
  #   auto - Adaptive color scheme based on the default light and dark color schemes.
  #
  # Default: auto
  #
  color_scheme: dark

  #
  # Select layout kinds
  #
  #layout_kind:
  #    "404": default
  #    cv: default

  social_links:
   - { platform: youtube,        url: "https://www.youtube.com/@theanurin42" }
   - { platform: telegram,       url: "https://t.me/theanurin" }
   - { platform: github,         url: "https://github.com/theanurin" }

jekyll_tidy:
  exclude: []
  ignore_env: development
  compress_html: true
