---
layout: layouts/base.html
---
<article>
  <p><small>{{ page.date | dateLocale: locale }}</small></p>

  {% if tags %}
    <p>
    {% for tag in tags %}
      <span class="badge rounded-pill text-bg-secondary">{{ tag }}</span>
    {% endfor %}
    </p>
  {% endif %}

  {% if cover %}
    <img src="{{ cover }}" alt="{{ title }} cover" class="img-fluid rounded mb-4"/>
  {% endif %}

  <div>
    {{ content }}
  </div>
</article>
