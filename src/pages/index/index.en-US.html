---
layout: layouts/base.html
title: "Home"
---

<h1>{{ title }}</h1>
<h2>{{ lang }}</h2>
<p>Welcome — this is a test home page (en).</p>

<h2>Latest posts</h2>
<ul>
{% for post in collections.posts_en reversed limit:5 %}
  <li>
    <a href="{{ post.url }}">{{ post.data.title }}</a>
    <small>{{ post.date | dateLocale: 'en-US' }}</small>
  </li>
{% endfor %}
</ul>
