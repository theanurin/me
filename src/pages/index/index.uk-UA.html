---
layout: layouts/base.html
title: "Головна"
---

<h1>{{ title }}</h1>
<h2>{{ lang }}</h2>
<p>Привіт — це тестова стартова сторінка (uk).</p>

<h2>Останні пости</h2>
<ul>
{% for post in collections.posts_uk reversed limit:5 %}
  <li>
    <a href="{{ post.url }}">{{ post.data.title }}</a>
    <small>{{ post.date | dateLocale: 'uk-UA' }}</small>
  </li>
{% endfor %}
</ul>
